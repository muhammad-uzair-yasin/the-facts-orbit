<meta charset="utf-8">
<title>Fact Orbit Brand</title>
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/archivo-black-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Anton';src:url('fonts/anton-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:800;src:url('fonts/inter-latin-800-normal.woff2') format('woff2')}
body{margin:0;background:#111}
</style>
<canvas id="c" width="800" height="800"></canvas>
<script>
const P=new URLSearchParams(location.search);const MODE=P.get('m')||'avatar';
const cv=document.getElementById('c');
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function stars(x0,y0,w,h,n,sd){for(let i=0;i<n;i++){const r=0.6+R(i+sd)*2.6;ctx.globalAlpha=0.35+R(i+sd+5)*0.65;ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(x0+R(i+sd)*w,y0+R(i+sd+9)*h,r,0,7);ctx.fill();}ctx.globalAlpha=1;}
function planet(cx,cy,r){
 const g2=ctx.createRadialGradient(cx-r*0.4,cy-r*0.45,r*0.1,cx,cy,r);
 g2.addColorStop(0,'#ffe3a3');g2.addColorStop(0.5,'#f59e0b');g2.addColorStop(1,'#a85f06');
 ctx.fillStyle=g2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
 // crater-ish shading
 ctx.globalAlpha=0.18;ctx.fillStyle='#7c4a05';[[-0.3,0.25,0.18],[0.35,0.05,0.13],[0.05,0.45,0.1]].forEach(c=>{ctx.beginPath();ctx.arc(cx+c[0]*r,cy+c[1]*r,c[2]*r,0,7);ctx.fill();});ctx.globalAlpha=1;
 // glow
 const gl=ctx.createRadialGradient(cx,cy,r,cx,cy,r*1.8);gl.addColorStop(0,'rgba(245,158,11,0.45)');gl.addColorStop(1,'rgba(245,158,11,0)');
 ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,r*1.8,0,7);ctx.fill();}
function orbit(cx,cy,rx,ry,rot,col,lw,dotAngle){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
 ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.stroke();
 if(dotAngle!=null){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(Math.cos(dotAngle)*rx,Math.sin(dotAngle)*ry,lw*2.2,0,7);ctx.fill();
  ctx.save();ctx.shadowColor='#9ad8ff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(Math.cos(dotAngle)*rx,Math.sin(dotAngle)*ry,lw*2.2,0,7);ctx.fill();ctx.restore();}
 ctx.restore();}
let ctx;
async function draw(){await document.fonts.load('100px "Archivo Black"');await document.fonts.load('800 44px Inter');await document.fonts.ready;
if(MODE==='avatar'){cv.width=800;cv.height=800;ctx=cv.getContext('2d');
 const g=ctx.createLinearGradient(0,0,800,800);g.addColorStop(0,'#1b1038');g.addColorStop(0.55,'#0d0a24');g.addColorStop(1,'#060414');
 ctx.fillStyle=g;ctx.fillRect(0,0,800,800);
 stars(40,40,720,720,70,3);
 planet(400,380,180);
 orbit(400,380,300,118,-0.45,'rgba(255,255,255,0.9)',7,2.3);
 orbit(400,380,250,210,0.9,'rgba(154,216,255,0.35)',4,null);
 ctx.font='96px "Archivo Black"';ctx.textAlign='center';ctx.fillStyle='#fff';
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;ctx.fillText('FACT',400,660);ctx.restore();
 ctx.font='800 44px Inter';ctx.fillStyle='#ffd98a';ctx.letterSpacing='18px';ctx.fillText('ORBIT',412,730);ctx.letterSpacing='0px';
}else{cv.width=2560;cv.height=1440;ctx=cv.getContext('2d');
 const g=ctx.createLinearGradient(0,0,0,1440);g.addColorStop(0,'#241247');g.addColorStop(0.5,'#120b2e');g.addColorStop(1,'#07051a');
 ctx.fillStyle=g;ctx.fillRect(0,0,2560,1440);
 stars(0,0,2560,1440,240,11);
 // nebula glows
 const nb=(x,y,r,c)=>{const gg=ctx.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,c);gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.fillRect(x-r,y-r,2*r,2*r);};
 nb(300,300,600,'rgba(124,58,237,0.25)');nb(2300,1100,700,'rgba(37,99,235,0.18)');nb(2200,260,500,'rgba(245,158,11,0.15)');
 // big planet left of wordmark (inside safe area-ish)
 planet(620,720,150);
 orbit(620,720,250,98,-0.4,'rgba(255,255,255,0.9)',6,2.2);
 // wordmark centered in safe area (safe: x 507-2053, y 508-931)
 ctx.textAlign='left';
 ctx.font='170px "Archivo Black"';ctx.fillStyle='#fff';
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.65)';ctx.shadowBlur=24;ctx.shadowOffsetY=8;ctx.fillText('FACT ORBIT',860,760);ctx.restore();
 ctx.font='800 54px Inter';ctx.fillStyle='#ffd98a';ctx.fillText('ONE MIND-BLOWING FACT A DAY',866,850);
 // small orbiting topic icons row (within safe area bottom)
 const icons=[['🌙',1050],['🏛️',1210],['🌊',1370],['🌍',1530]];
 // draw simple glyph circles instead of emoji for render-safety
 const glyphs=[
  (x,y)=>{ctx.fillStyle='#e8ecf4';ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fill();ctx.fillStyle='#120b2e';ctx.beginPath();ctx.arc(x+14,y-6,26,0,7);ctx.fill();}, // moon
  (x,y)=>{ctx.fillStyle='#e8ecf4';for(let k=0;k<3;k++){ctx.fillRect(x-30+k*24,y-18,14,40);}ctx.fillRect(x-38,y-30,76,10);ctx.fillRect(x-38,y+22,76,10);}, // columns
  (x,y)=>{ctx.strokeStyle='#9ad8ff';ctx.lineWidth=8;ctx.lineCap='round';for(let k=0;k<2;k++){ctx.beginPath();for(let i=0;i<=20;i++){const q=i/20;ctx.lineTo(x-34+q*68,y-8+k*20+Math.sin(q*6.3)*8);}ctx.stroke();}}, // waves
  (x,y)=>{ctx.strokeStyle='#8fe3a8';ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,32,0,7);ctx.stroke();ctx.beginPath();ctx.ellipse(x,y,32,13,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-32);ctx.lineTo(x,y+32);ctx.stroke();}, // globe
 ];
 glyphs.forEach((f,i)=>{ctx.save();ctx.globalAlpha=0.95;f(900+i*170,935-25);ctx.restore();});
 ctx.font='800 36px Inter';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fillText('SPACE  ·  HISTORY  ·  NATURE  ·  WORLD',866,1010);
 // safe-area is y 508-931 on 2560x1440; tagline at 850 ok; glyph row at ~910 ok; small text 1010 is outside safe (visible on desktop only) - acceptable secondary
}
window.ready=true;}
draw();
</script>
